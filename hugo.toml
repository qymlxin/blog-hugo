baseURL = 'https://qymlxin.cn'
locale = 'zh-cn'
title = 'Qymlxin Blog'
enableRobotsTXT = true

# outputs 必须在站点配置中定义，不会从主题继承
[outputs]
  home = ['HTML', 'RSS', 'JSON']

[module]
  [[module.imports]]
    path = 'github.com/qymlxin/qyml-hugo-theme'

[params]
  author = 'Qymlxin'
  description = 'Personal blog of Qymlxin.'
  subtitle = 'Everything is possible.'
  avatar   = '/images/logo.png'   # 图片放 static/images/avatar.jpg
  location = 'Chengdu, China'

[params.artalk]
  server = 'https://artalk.qymlxin.cn'
  site = 'qymlxin_blog'
  localSite = '' # 仅供 HUGO_PARAMS_ARTALK_LOCALSITE 在本地启动时临时覆盖

# ── 社交账号（填了才显示，没填不显示） ──
[params.social]
  github   = 'qymlxin'   # GitHub 用户名
  gitee    = 'qymlxin'   # Gitee 用户名
  # telegram = ''   # Telegram 用户名（不含 @）
  # twitter  = ''   # X/Twitter 用户名（不含 @）
  # weibo    = ''   # 微博用户名或完整 URL
  # bilibili = ''   # B站 UID 或完整 space URL
  # douyin   = ''   # 抖音主页完整 URL
  wechat   = 'vx15983207568'   # 微信号（显示为文字标签，不可点击）
  # qq       = '2593654373'   # QQ 号（显示为文字标签，不可点击）
  email    = 'qymlxin@gmail.com'   # 邮箱地址
  # website  = ''   # 个人网站完整 URL
