{{ $artalkSite := site.Params.artalk.site }}
{{ if hugo.IsServer }}
  {{ with site.Params.artalk.localSite }}
    {{ $artalkSite = . }}
  {{ else }}
    {{ $artalkSite = printf "%s_dev" $artalkSite }}
  {{ end }}
{{ end }}

<section class="comments-section">
  <h2 class="comments-title">评论</h2>
  <div
    id="Comments"
    data-artalk-server="{{ site.Params.artalk.server }}"
    data-artalk-site="{{ $artalkSite }}"
    data-artalk-page-key="{{ .RelPermalink }}"
    data-artalk-page-title="{{ .Title }}"
  ></div>
</section>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/artalk@2.10.0/dist/Artalk.css">
<style>
  #Comments {
    --artalk-control-bg: var(--surface);
    --artalk-control-bg-hover: var(--surface-soft);
    --artalk-control-text: var(--text);
    --artalk-control-muted: var(--muted);
    --artalk-control-border: var(--border);
    --artalk-control-accent: var(--accent);
    --artalk-control-accent-hover: var(--accent-hover);
    color: var(--artalk-control-text);
    font-family: var(--font-sans);
  }

  #Comments .atk-main-editor,
  #Comments .atk-list-header,
  #Comments .atk-list-footer,
  #Comments .atk-footer {
    border-color: var(--artalk-control-border);
  }

  #Comments .atk-input,
  #Comments .atk-textarea-wrap,
  #Comments .atk-editor-edit {
    background: var(--artalk-control-bg);
    border-color: var(--artalk-control-border);
    border-radius: var(--radius);
    color: var(--artalk-control-text);
    box-shadow: none;
  }

  #Comments .atk-input::placeholder,
  #Comments .atk-editor-edit::placeholder {
    color: var(--artalk-control-muted);
    opacity: 0.82;
  }

  #Comments .atk-input:focus,
  #Comments .atk-textarea-wrap:focus-within,
  #Comments .atk-editor-edit:focus {
    border-color: var(--artalk-control-accent);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--artalk-control-accent) 16%, transparent);
  }

  #Comments .atk-btn,
  #Comments .atk-plug-btn,
  #Comments .atk-common-action-btn,
  #Comments .atk-show-btn {
    border: 1px solid var(--artalk-control-border);
    border-radius: var(--radius);
    background: transparent;
    color: var(--artalk-control-muted);
    font-family: inherit;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  #Comments .atk-btn:hover,
  #Comments .atk-plug-btn:hover,
  #Comments .atk-common-action-btn:hover,
  #Comments .atk-show-btn:hover {
    border-color: var(--artalk-control-accent);
    background: var(--artalk-control-bg-hover);
    color: var(--artalk-control-accent);
  }

  #Comments .atk-send-btn {
    min-height: 2.25rem;
    padding: 0.4rem 1rem;
    border: 1px solid var(--artalk-control-accent);
    border-radius: var(--radius);
    background: var(--artalk-control-accent);
    color: var(--bg);
    font-family: inherit;
    font-weight: 600;
    letter-spacing: 0.04em;
    box-shadow: none;
  }

  #Comments .atk-send-btn:hover,
  #Comments .atk-send-btn:focus-visible {
    border-color: var(--artalk-control-accent-hover);
    background: var(--artalk-control-accent-hover);
    color: var(--bg);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--artalk-control-accent) 20%, transparent);
  }

  #Comments .atk-send-btn:disabled {
    border-color: var(--artalk-control-border);
    background: var(--artalk-control-bg-hover);
    color: var(--artalk-control-muted);
    opacity: 1;
  }

  #Comments .atk-footer,
  #Comments .atk-copyright {
    display: none;
  }

  #Comments .atk-list-footer {
    color: var(--artalk-control-muted);
  }

  #Comments a {
    color: var(--artalk-control-accent);
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/artalk@2.10.0/dist/Artalk.js"></script>
<script>
  const getArtalkDarkMode = () => {
    const explicitTheme = document.documentElement.dataset.theme;
    return explicitTheme
      ? explicitTheme === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
  };

  const artalkRoot = document.querySelector("#Comments");
  const artalk = Artalk.init({
    el: artalkRoot,
    server: artalkRoot.dataset.artalkServer,
    site: artalkRoot.dataset.artalkSite,
    pageKey: artalkRoot.dataset.artalkPageKey,
    pageTitle: artalkRoot.dataset.artalkPageTitle,
    locale: "zh-CN",
    darkMode: getArtalkDarkMode(),
  });

  window.addEventListener("theme-changed", ({ detail }) => {
    artalk.setDarkMode(detail.theme === "dark");
  });
</script>
